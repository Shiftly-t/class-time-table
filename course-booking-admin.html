<!doctype html>
<html lang="ja" data-shiftly-environment="production">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f6f8fc">
    <title>Shiftly-T | 講習予約 管理者</title>
    <link rel="stylesheet" href="./booking.css?v=20261111-closures">
    <style>
      /* Match the primary management header without changing the booking body. */
      .admin-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px clamp(16px, 4vw, 54px);
        background: #fff;
        border-bottom: 1px solid #e9edf5;
        min-height: 72px;
        flex-wrap: nowrap;
      }
      .admin-topbar .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 21px;
        font-weight: 850;
        letter-spacing: -0.6px;
        white-space: nowrap;
        min-width: 0;
        color: #18243c;
      }
      .admin-topbar .brand small {
        display: block;
        font-size: 9px;
        color: #9ba6ba;
        letter-spacing: 1.4px;
      }
      .admin-topbar .brandmark {
        background: #4f63e9;
        color: #fff;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 900;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
      }
      .admin-topbar .header-actions {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
      }
      .admin-topbar .admin-back {
        display: inline-block;
        text-decoration: none;
        background: #fff;
        border: 1px solid #dfe5f0;
        color: #61708c;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .admin-topbar .admin-back:hover {
        background: #f5f7fc;
      }
      .admin-topbar .admin-back:focus-visible {
        outline: 3px solid #bac5ff;
        outline-offset: 2px;
      }
      @media (max-width: 680px) {
        .admin-topbar {
          padding: 11px 14px;
          min-height: 64px;
        }
        .admin-topbar .brand {
          font-size: 18px;
        }
        .admin-topbar .brand small {
          font-size: 8px;
        }
      }
      @media (max-width: 340px) {
        .admin-topbar {
          gap: 8px;
          padding-inline: 10px;
        }
        .admin-topbar .admin-back {
          padding-inline: 9px;
        }
      }
      html.booking-embedded .admin-topbar {
        display: none;
      }
      html.booking-embedded .main {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0 2px 24px;
      }
      @media print {
        html.booking-embedded .main {
          display: none !important;
        }
      }
    </style>
    <script>
      try {
        if (
          window.parent !== window &&
          window.parent.location.origin === location.origin &&
          new URLSearchParams(location.search).get('embedded') === '1'
        ) {
          document.documentElement.classList.add('booking-embedded');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar admin-topbar">
      <div class="brand">
        <span class="brandmark">S</span>
        <span>Shiftly-T<small>ver 26.0</small></span>
      </div>
      <div class="header-actions">
        <a class="admin-back" href="./index.html">管理画面に戻る</a>
      </div>
    </header>
    <main class="main">
      <div class="page-title">
        <div>
          <p class="eyebrow">SEASONAL COURSE RESERVATIONS</p>
          <h1>講習予約 管理</h1>
          <p class="muted">提出状況・QR配布・希望日時・確定と公開を一つの画面で管理します。</p>
        </div>
      </div>
      <div id="feedback" class="status" role="status" aria-live="polite"></div>
      <div class="actions" id="printReadyWrap" hidden>
        <button class="primary" id="printReady" type="button">QRコードの印刷プレビューを開く</button>
        <button class="secondary" id="printDiscard" type="button">印刷準備を閉じる</button>
      </div>
      <div id="app" class="panel">管理者のログイン状態を確認しています…</div>
    </main>
    <div id="printRoot" class="printarea" aria-hidden="true"></div>
    <dialog class="dialog" id="askDialog">
      <h2 id="askTitle">確認</h2>
      <p id="askText" class="muted"></p>
      <div class="actions">
        <button class="secondary" type="button" id="askNo">キャンセル</button>
        <button class="danger" type="button" id="askYes">実行する</button>
      </div>
    </dialog>
    <script type="module" src="./course-booking-admin.js?v=prod-ranking-20261126-a"></script>
  </body>
</html>
