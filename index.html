<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fc"><title>Shiftly | ホーム</title><link rel="stylesheet" href="./style.css?v=loginonly1"></head>
<body><header class="topbar"><div class="brand"><span class="brand-icon">S</span><span>Shiftly</span></div><button id="logout" class="ghost" type="button" hidden>ログアウト</button></header><main class="content"><section id="loginPanel" class="card" hidden><div class="login-mark">S</div><p class="eyebrow">WELCOME BACK</p><h1>おかえりなさい</h1><p class="sub">アカウントにログインしてください。</p><form id="loginForm" class="stack"><label>メールアドレス<input id="email" type="email" autocomplete="username" placeholder="name@example.com" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" placeholder="パスワードを入力" required></label><button class="primary" type="submit">ログイン →</button></form></section><section id="appPanel" class="card home" hidden><div class="welcome-icon">✓</div><p class="eyebrow">YOUR HOME</p><h1 id="welcomeName">ようこそ</h1><p class="sub">ログインしています。</p><p id="roleLabel" class="role"></p></section><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="./app.js?v=loginonly1"></script></body></html>
