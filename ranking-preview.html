<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shiftly-T ランキング開発プレビュー</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./ranking.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">S</span><span>Shiftly-T<small>QA PREVIEW</small></span></div><div class="header-actions"><button id="rankingButton" class="icon-button" type="button" title="ランキング" aria-label="ランキングを開く" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v7a5 5 0 0 1-10 0V4ZM7 6H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4"/></svg><span>ランキング</span></button></div></header><main class="app-main"><h1>ランキング開発プレビュー</h1><p>架空データのみ・Firebase接続なし</p><label>表示権限<select id="demoRole"><option value="employee">講師</option><option value="admin">管理者</option><option value="owner">運営</option></select></label><p>ヘッダーのランキングを押してください。</p></main><dialog id="rankingDialog" class="modal" aria-label="講師ランキング"><div id="rankingHost" class="ranking-shell"></div></dialog><script type="module">import {installRankingPreview} from './ranking-preview.js';const $=id=>document.getElementById(id);const preview=installRankingPreview({button:$('rankingButton'),dialog:$('rankingDialog'),host:$('rankingHost'),getRole:()=>$('demoRole').value,getAvailable:()=>true});$('demoRole').addEventListener('change',()=>{if($('rankingDialog').open)$('rankingDialog').close();preview.sync();});</script></body></html>
